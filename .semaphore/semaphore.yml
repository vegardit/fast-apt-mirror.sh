# https://docs.semaphoreci.com/reference/pipeline-yaml-reference/
version: v1.0

name: fast-apt-mirror.sh

# See https://docs.semaphore.io/reference/machine-types
# and https://docs.semaphore.io/reference/os-ubuntu
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404

blocks:
- name: "Run shellcheck"
  run:
    when: "change_in('/', {exclude: ['/.github'], default_branch: 'v1'})"
  task:
    prologue:
      commands:
      - checkout
    jobs:
    - name: "Run shellcheck"
      commands:
      - bash tests/run-shellcheck.sh

- name: "Run tests"
  run:
    when: "change_in('/', {exclude: ['/.github'], default_branch: 'v1'})"
  task:
    prologue:
      commands:
      - checkout
    jobs:
    - name: "Run Tests"
      commands:
      - bash tests/run-tests.sh
